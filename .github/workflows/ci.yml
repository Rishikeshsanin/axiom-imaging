name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - name: Ruff correctness checks
        run: ruff check app tests --select E9,F
      - run: python -m compileall -q app tests
      - run: pytest -ra

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - name: Lint frontend
        shell: bash
        run: |
          set +e
          npx eslint . --format json > /tmp/axiom-eslint.json
          status=$?
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const report = JSON.parse(fs.readFileSync('/tmp/axiom-eslint.json', 'utf8'));
          const cwd = process.cwd();
          for (const file of report) {
            const relative = path.relative(cwd, file.filePath).replaceAll('\\', '/');
            for (const item of file.messages) {
              const level = item.severity === 2 ? 'error' : 'warning';
              const title = item.ruleId ? `ESLint ${item.ruleId}` : 'ESLint';
              const message = String(item.message).replaceAll('\n', '%0A').replaceAll('\r', '%0D');
              console.log(`::${level} file=${relative},line=${item.line || 1},col=${item.column || 1},title=${title}::${message}`);
            }
          }
          NODE
          if [ "$status" -ne 0 ]; then
            {
              echo "### ESLint failure"
              echo '```json'
              cat /tmp/axiom-eslint.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - run: npm run build

  device-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/device-engine
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  production-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build FastAPI + Orthanc/OHIF + C++ gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/render/Dockerfile
          push: false
          tags: axiom-imaging-core:ci
