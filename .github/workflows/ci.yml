name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - name: Ruff correctness checks
        run: ruff check app tests --select E9,F
      - run: python -m compileall -q app tests
      - run: pytest -ra

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - name: Lint frontend
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee /tmp/axiom-eslint.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### ESLint failure"
              echo '```text'
              cat /tmp/axiom-eslint.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - run: npm run build

  device-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/device-engine
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  production-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build FastAPI + Orthanc/OHIF + C++ gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/render/Dockerfile
          push: false
          tags: axiom-imaging-core:ci
